name: ds5500
version: "0.1.0"
profile: ds5500

model-paths: ["models"]
seed-paths: ["seeds"]

vars:
  # Case-insensitive substring of BERDO "Parcel Owner Name"; change to model another school
  school_pattern: wentworth
  berdo_xlsx: ../data/raw/2026-berdo-data-disclosure-9.30.26.xlsx
  # Suffolk County (G2500250) results from ComStock 2025 release 3: upgrade 0 is the
  # baseline, 1-65 are single measures and packages
  comstock_dir: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2025/comstock_amy2018_release_3/metadata_and_annual_results/by_state_and_county/basic/parquet/state=MA/county=G2500250
  comstock_county_prefix: MA_G2500250
  comstock_max_upgrade: 65
  # "full" results add the geometry and equipment sizes (out.params.*) that costing needs
  comstock_full_dir: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2025/comstock_amy2018_release_3/metadata_and_annual_results/by_state_and_county/full/parquet/state=MA/county=G2500250
  # the retrofit upgrades compared for 2030 compliance (see comstock_package_components)
  package_upgrade_ids: [3, 6, 7, 12, 19, 20, 21, 29, 43, 46, 48, 49, 52, 54, 55, 56, 57, 58, 65]
  # upgrades added after the original eight (VRF, geothermal, PV, Package 5, Package 12); they
  # are only offered to buildings where a matched model applies them at a nonzero cost
  expanded_upgrade_ids: [3, 6, 7, 12, 19, 20, 21, 29, 46, 58, 65]
  # NLR 2024 Buildings Technology Baseline, commercial flat file (OEDI submission 8342)
  btb_csv: https://data.openei.org/files/8342/btb2024_commercial_dataset%20(4).csv
  # BTB cost projection year and scenario; costs are in 2023 dollars either way
  btb_year: 2030
  btb_scenario: Reference
  # City of Boston Planning Department GIS Lab, "Boston Buildings with Roof Breaks": roof
  # outlines for every building in Boston, one polygon per roof section with its 2010 LiDAR
  # height (data.boston.gov dataset boston-buildings-with-roof-breaks)
  boston_buildings_url: https://data.boston.gov/dataset/08fd5249-2d75-42ef-ac23-951f3e0ec259/resource/57026638-b4e8-4dfa-8644-0e2cfe925a46/download/boston_buildings_with_roof_breaks_geojson.zip
  # City of Boston "Parcels (2025)"; MAP_PAR_ID is the assessing PID that BERDO's Tax Parcel
  # ID uses (data.boston.gov dataset parcels-2025)
  boston_parcels_url: https://data.boston.gov/dataset/d0fe512c-80bd-4ed7-8582-c6ec38aedfa0/resource/905e3f0a-1b17-4105-a4dd-c6c3f04690cd/download/parcels_2025_geojson.zip
  # floor-to-floor height used to turn roof height into stories (int_berdo_building_stories);
  # 13 ft is the DOE medium and large office prototypes' floor-to-floor height
  floor_to_floor_ft: 13
  # upper bound on an unchecked GFA / footprint stories estimate: 200 Clarendon, Boston's
  # tallest building, has 60 stories
  max_stories: 60
  # BERDO property types to match to ComStock models (via the crosswalk seed)
  match_property_types: ["Office", "Financial Office"]
  # nearest ComStock models per BERDO building
  # 20 with inverse-distance weighting and the district rule had the lowest leave-one-out
  # error of k = 1..24 for {unweighted, inverse_distance} x {no rule, district rule}
  match_k: 20
  # match district-energy buildings only to district-energy models, and the rest only to
  # models without it; otherwise a building's district emissions get no upgrade ratio
  # (metric_sensitivity.py compares this and other weightings)
  match_district_rule: true
  # weight of the stories term, |ln stories ratio|, in the match distance (the size, EUI and
  # fuel-share terms have match_w_size/match_w_eui/match_w_fuel, 1 by default)
  match_w_stories: 1
  # how matched models are pooled downstream: unweighted (each counts equally) or
  # inverse_distance (1 / (distance + 1e-6))
  match_weighting: inverse_distance
  # BERDO Alternative Compliance Payment, $ per metric ton CO2e over the limit
  # (City of Boston, "Complying with BERDO's Emissions Standard", Feb 2024); taken as
  # dollar_year dollars and held constant in real terms
  acp_usd_per_tco2e: 234
  # first year of the 5-year standards period the retrofit decision is made for; "compliant"
  # means under this period's standard in its first year
  decision_period_start: 2030
  # first year of the 20-year global cost (berdo_global_cost): the model looks forward from
  # the earliest year a decision could take effect, so it charges the ACPs of the rest of the
  # 2025-2029 period before the decision_period_start standard
  horizon_start: 2027
  # every cost is converted to dollar_year dollars with the BEA GDP price deflator
  # (gdp_price_deflator seed; FRED A191RD3A086NBEA, last updated 2026-09-30). Energy
  # prices and AEO are already 2025 dollars; BTB is btb_dollar_year dollars; the imputed
  # costs carry their own dollar_year
  dollar_year: 2025
  btb_dollar_year: 2023
  # berdo_decision_options: how much of equipment that lasts ~20 years the 5-year period
  # bears: annualized (equivalent annual cost at discount_rate_financial), straight_line
  # (remaining value credited at the period's end), or full
  five_year_capital: annualized
  # options that keep the existing heating/cooling equipment (no retrofit, lighting, envelope,
  # PV) pay for replacing it like-for-like (int_berdo_existing_hvac); options with any of
  # hvac_replacing_measures replace it instead. The 5-year view charges it like any capital
  # (none under five_year_capital: full); the 20-year view first replaces it after
  # existing_hvac_remaining_years, half the 21-year BTB lifetime, as its age is unknown
  like_for_like_hvac: true
  existing_hvac_remaining_years: 10.5
  hvac_replacing_measures: [add_heat_pump_rtu, replace_boiler_by_heatpump, hvac_vrf_hr_doas, add_packaged_gshp]
  # berdo_global_cost: EN 15459 global cost over the EU cost-optimal calculation period for
  # non-residential buildings (Delegated Regulation 244/2012), from decision_period_start
  global_cost_years: 20
  # real discount rates: a private owner's cost of capital, and a societal rate matching
  # the 2% used for the social cost of carbon below
  discount_rate_financial: 0.07
  discount_rate_societal: 0.02
  # US EPA (2023) social cost of CO2 at a 2% discount rate, 2020 dollars: $190 for 2020
  # emissions, $210 for 2024, rising to about $230 for 2030; held flat over the horizon and
  # converted from social_cost_dollar_year to dollar_year dollars
  social_cost_usd_per_tco2e: 230
  social_cost_dollar_year: 2020
  # annual O&M as a share of installed cost, net of the equipment a measure replaces; BTB
  # gives none and no sourced defaults were found, so 0 (set to test sensitivity)
  om_share_per_year: 0

  # analysis models (models/analysis) write their CSVs here; paths are relative to dbt/,
  # where dbt is run
  analysis_outputs_dir: analysis_outputs
  report_data_dir: ../report-2/data
  # paired bootstrap of the leave-one-out comparisons: resamples, and the seed of the
  # hash that picks them
  bootstrap_draws: 4000
  bootstrap_seed: 5500

models:
  ds5500:
    analysis:
      +materialized: table
    staging:
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
