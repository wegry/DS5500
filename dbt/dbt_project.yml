name: ds5500
version: "0.1.0"
profile: ds5500

model-paths: ["models"]
seed-paths: ["seeds"]

vars:
  # Case-insensitive substring of BERDO "Parcel Owner Name"; change to model another school
  school_pattern: wentworth
  berdo_xlsx: ../data/raw/2026-berdo-data-disclosure-9.30.26.xlsx
  # Suffolk County (G2500250) results from ComStock 2025 release 3: upgrade 0 is the
  # baseline, 1-65 are single measures and packages
  comstock_dir: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2025/comstock_amy2018_release_3/metadata_and_annual_results/by_state_and_county/basic/parquet/state=MA/county=G2500250
  comstock_county_prefix: MA_G2500250
  comstock_max_upgrade: 65
  # BERDO property types to match to ComStock models (via the crosswalk seed)
  match_property_types: ["Office", "Financial Office"]
  # nearest ComStock models per BERDO building
  match_k: 10
  # BERDO Alternative Compliance Payment, $ per metric ton CO2e over the limit
  # (City of Boston, "Complying with BERDO's Emissions Standard", Feb 2024)
  acp_usd_per_tco2e: 234

models:
  ds5500:
    staging:
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
