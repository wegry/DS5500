version: 2

seeds:
  - name: berdo_emissions_standards
    description: >
      BERDO emissions standards (kgCO2e/sq ft/yr) by building use and 5-year period, from
      Table 2 of City of Boston, "Complying with BERDO's Emissions Standard" (Feb 2024),
      matching the table on https://www.boston.gov/departments/environment/berdo
      (checked 2026-10-17). period_end is null for 2050 onward (net zero).
  - name: berdo_property_type_uses
    description: >
      Portfolio Manager property type -> BERDO building use, derived from the 2026
      disclosure: single-use buildings whose disclosed 2025-2029 standard identifies the use
      (the 13 first-period standards are all distinct). evidence_buildings counts them.
    columns:
      - name: property_type
        data_tests: [unique, not_null]
  - name: comstock_package_components
    description: >
      The four ComStock retrofit packages compared for 2030 compliance, broken into the
      measures they apply (named by ComStock's applicability.* columns) and the 2024 BTB
      technology costed for each. ComStock does not name equipment, so the BTB choices are
      proxies: a double-pane aluminum-frame window for AEDG windows, the cold-climate RTU
      heat pump for the variable-speed HP RTU, the hydronic heat pump (priced per ton of
      cooling, sized from heating capacity) for HP boilers, and an LED troffer/panel for
      LED lighting.
    columns:
      - name: btb_measure_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_btb_unit_costs')
                field: btb_measure_id
  - name: fuel_prices
    description: >
      Flat Massachusetts energy prices per kWh delivered, for the fuels BERDO reports, with
      a low/mid/high range. Electricity and gas are EIA commercial averages (revenue / sales,
      so they include fixed and demand charges on average); oil is the state heating-oil
      survey. Boston publishes no district steam or chilled water tariff, so those two are
      proxies for the cost of making the same heat or cooling on site. basis gives each
      source, conversion, and how the range was set.
    columns:
      - name: fuel
        data_tests: [unique, not_null]
      - name: usd_per_kwh_low
        data_tests: [not_null]
      - name: usd_per_kwh_mid
        data_tests: [not_null]
      - name: usd_per_kwh_high
        data_tests: [not_null]

models:
  - name: stg_berdo__portfolios
    columns:
      - name: portfolio_id
        data_tests: [unique, not_null]
  - name: stg_comstock__upgrades
    columns:
      - name: comstock_upgrade_key
        data_tests: [unique, not_null]
      - name: weight
        data_tests: [not_null]
  - name: stg_comstock__package_measures
    columns:
      - name: comstock_measure_key
        data_tests: [unique, not_null]
  - name: stg_btb__technologies
    columns:
      - name: btb_measure_id
        data_tests: [unique, not_null]
  - name: int_btb_unit_costs
    columns:
      - name: btb_measure_id
        data_tests: [unique, not_null]
      - name: cost_unit
        data_tests: [not_null]
      - name: unit_cost_mid_usd
        data_tests: [not_null]
  - name: int_comstock_package_costs
    columns:
      - name: comstock_component_key
        data_tests: [unique, not_null]
      - name: installed_cost_mid_usd
        data_tests: [not_null]
  - name: int_berdo_package_costs
    columns:
      - name: berdo_component_key
        data_tests: [unique, not_null]
  - name: stg_comstock__baseline
    columns:
      - name: comstock_key
        data_tests: [unique, not_null]
  - name: int_comstock_archetypes
    columns:
      - name: comstock_type
        data_tests: [unique, not_null]
  - name: int_school_buildings
    columns:
      - name: berdo_id
        data_tests: [unique, not_null]
  - name: int_berdo_match_buildings
    columns:
      - name: berdo_id
        data_tests: [unique, not_null]
  - name: int_berdo_comstock_matches
    columns:
      - name: match_key
        data_tests: [unique, not_null]
  - name: school_berdo_comstock
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: comstock_type
        data_tests: [not_null]
  - name: berdo_upgrade_scenarios
    columns:
      - name: scenario_key
        data_tests: [unique, not_null]
      - name: projected_ghg_kgco2e
        data_tests: [not_null]
  - name: int_berdo_building_property_types
    columns:
      - name: building_property_type_key
        data_tests: [unique, not_null]
  - name: int_berdo_building_standards
    columns:
      - name: building_period_key
        data_tests: [unique, not_null]
  - name: berdo_upgrade_compliance
    columns:
      - name: compliance_key
        data_tests: [unique, not_null]
      - name: standard_kgco2e_sqft
        data_tests: [not_null]
  - name: berdo_match_quality
    columns:
      - name: berdo_id
        data_tests: [unique, not_null]
  - name: berdo_decision_options
    columns:
      - name: option_key
        data_tests: [unique, not_null]
      - name: energy_cost_mid_usd_per_year
        data_tests: [not_null]
      - name: total_cost_mid_usd
        data_tests: [not_null]
  - name: berdo_global_cost
    columns:
      - name: global_cost_key
        data_tests: [unique, not_null]
      - name: global_cost_mid_usd
        data_tests: [not_null]
  - name: berdo_decisions
    columns:
      - name: berdo_id
        data_tests: [unique, not_null]
  - name: berdo_data_quality
    columns:
      - name: berdo_id
        data_tests: [unique, not_null]
